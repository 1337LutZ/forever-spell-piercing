name: Deploy

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: deploy
    cancel-in-progress: true

env:
    PROJECT_NAME: forever-spell-piercing

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  persist-credentials: false

            - name: Install Node
              uses: actions/setup-node@v5
              with:
                  node-version: 22

            - name: Test
              run: npm test

            - name: Build
              run: npm run build

            # The first deploy needs the Pages project to exist; later runs find it and skip this.
            - name: Create the Pages project
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                  : "${CLOUDFLARE_API_TOKEN:?secret CLOUDFLARE_API_TOKEN is not set}"
                  : "${CLOUDFLARE_ACCOUNT_ID:?secret CLOUDFLARE_ACCOUNT_ID is not set}"
                  if ! npx --yes wrangler@4 pages project list | grep -qw "$PROJECT_NAME"; then
                      npx --yes wrangler@4 pages project create "$PROJECT_NAME" --production-branch=main
                  fi

            - name: Deploy to Cloudflare Pages
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                  npx --yes wrangler@4 pages deploy dist \
                    --project-name="$PROJECT_NAME" \
                    --branch=main \
                    --commit-hash="$GITHUB_SHA"
